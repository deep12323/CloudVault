name: Build & Release CloudVault APK

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Configure AAPT2 for CI
        run: sed -i '/android.aapt2FromMavenOverride/d' gradle.properties

      - name: Build Signed Release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Prepare Clean Release APK Files
        id: prepare_apks
        run: |
          mkdir -p release-apks
          VERSION="1.0.1"
          
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "release-apks/CloudVault-v${VERSION}-arm64-v8a.apk" || true
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk "release-apks/CloudVault-v${VERSION}-armeabi-v7a.apk" || true
          cp app/build/outputs/apk/release/app-x86_64-release.apk "release-apks/CloudVault-v${VERSION}-x86_64.apk" || true
          cp app/build/outputs/apk/release/app-x86-release.apk "release-apks/CloudVault-v${VERSION}-x86.apk" || true
          cp app/build/outputs/apk/release/app-universal-release.apk "release-apks/CloudVault-v${VERSION}-universal.apk" || true
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CloudVault-Release-APKs
          path: release-apks/*.apk

      - name: Create Clean GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.prepare_apks.outputs.version }}
          name: "CloudVault v${{ steps.prepare_apks.outputs.version }}"
          body: |
            ### Downloads

            - **`CloudVault-v${{ steps.prepare_apks.outputs.version }}-arm64-v8a.apk`** — Recommended for modern 64-bit Android smartphones & tablets.
            - **`CloudVault-v${{ steps.prepare_apks.outputs.version }}-universal.apk`** — Universal build compatible with all devices.
            - **`CloudVault-v${{ steps.prepare_apks.outputs.version }}-armeabi-v7a.apk`** — 32-bit Android devices.
            - **`CloudVault-v${{ steps.prepare_apks.outputs.version }}-x86_64.apk`** — 64-bit Chromebooks and Emulators.
            - **`CloudVault-v${{ steps.prepare_apks.outputs.version }}-x86.apk`** — 32-bit Emulators.

            ### What's New in v${{ steps.prepare_apks.outputs.version }}

            - Instant 4K/1080p video streaming powered by LibVLC with subtitle, audio track, and multi-part ZIP streaming
            - PDF and document reader with horizontal page swiping (ViewPager2), pinch-to-zoom (up to 6x), and page jump
            - Background audio player with floating mini-player, queue management, and ID3 album art
            - 9 custom themes with full background, status bar, and card surface styling
            - Smart media gallery with Day, Month, and Year timeline grid zoom
            - Real-time automatic camera folder backup to private Telegram storage
            - Checksum-based duplicate file scanner and cleaner
          files: release-apks/*.apk
          draft: false
          prerelease: false
          make_latest: true
